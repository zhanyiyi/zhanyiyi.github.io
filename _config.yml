title: Zhanyi Blog
description: 技术、产品与实践笔记。
url: "https://zhanyiyi.github.io"
baseurl: ""
lang: zh-CN
timezone: Asia/Shanghai

author:
  name: Zhanyi
  email:

permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Zhanyi
  - scope:
      path: ""
    values:
      layout: page

markdown: kramdown
kramdown:
  input: GFM

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
